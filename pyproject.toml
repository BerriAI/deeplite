[project]
name = "deeplite"
version = "0.1.0"
description = "A LangGraph swarm CLI with OpenTelemetry tracing"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "deepagents>=0.7.20",
    "exa-py>=2.23.0",
    "langchain>=1.4.3",
    "langchain-anthropic>=1.7.5",
    "langchain-openai>=1.6.7",
    "langgraph-swarm>=0.1.0",
    "langsmith[otel]",
    "openinference-instrumentation-langchain>=0.1.78",
    "opentelemetry-distro>=0.66b0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "python-dotenv",
]

[project.scripts]
deeplite = "deeplite.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
